<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Thời khóa biểu</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h1>Quản lý Thời khóa biểu</h1>
        <checktable
            v-model="gridRef"
            :title="'Thời khóa biểu'"
            :labels="labels"
            :datas="Datas"
        />
        <div class="mb-3 text-end">
            <button
                class="btn btn-primary"
                :disabled="!gridRef?.hasChanges"
                @click="handleSyncToServer"
            >Đồng bộ {{ gridRef?.changedPayload?.length || 0 }} thay đổi</button>
        </div>
    </div>

    <script src="components/checktable.js"></script>

    <script>
        const { createApp, ref } = Vue;

        const app = createApp({
            setup() {
                // Cấu hình các cột (labels) [cite: 5, 10]
                const gridRef = ref(null);
                const labels = ref({});

                // Dữ liệu mô phỏng (Sau này lấy từ Golang Server qua Fetch API) [cite: 6]
                const Datas = ref([
                  { lop_id:1,
                    mon:{
                      '1':'1',
                      '2':'1',
                      '3':'3',
                      '4':'2',
                      '5':'3',
                  }},
                  { lop_id:2,
                    mon:{
                      '1':'2',
                      '2':'2',
                      '3':'3',
                      '4':'5',
                      '5':'3',
                    }},
                  { lop_id:3,                    
                    mon:{
                      '1':'3',
                      '2':'1',
                      '3':'2',
                      '4':'5',
                      '5':'4',
                    }},
                ]);


                // Hàm xử lý đồng bộ [cite: 14]
                const handleSyncToServer = async () => {
                    const payload = gridRef.value.changedPayload;
                    console.log('Dữ liệu gửi lên Golang:', payload);
                    // Dùng fetch() gửi lên server Go ở đây
                    /*
                    fetch('/api/sync-schedule', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedData)
                    })
                    .then(res => res.json())
                    .then(data => alert('Đồng bộ thành công!'))
                    .catch(err => console.error('Lỗi:', err));
                    */
                    alert('Kiểm tra console để xem dữ liệu chuẩn bị gửi!');
                    
                    // Cập nscheduleData=scheduleData=scheduleData;
                    Datas.value = [
                      { lop_id:1,
                          mon:{
                          '1':'1',
                          '2':'1',
                          '3':'5',
                          '4':'2',
                          '5':'3',
                      }},
                      { lop_id:2,
                        mon:{
                          '1':'2',
                          '2':'2',
                          '3':'3',
                          '4':'5',
                          '5':'4',
                        }},
                      { lop_id:3,                    
                        mon:{
                          '1':'3',
                          '2':'1',
                          '3':'4',
                          '4':'5',
                          '5':'5',
                        }},
                    ];
                };

                return {
                    gridRef,
                    labels,
                    Datas,
                    handleSyncToServer
                };
            }
        });

        // Đăng ký component toàn cục để dùng trong HTML

        // Chạy ứng dụng
        app.mount('#app');
    </script>
