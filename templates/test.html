{{define "content"}}
<div id="app">
  <h1>Tạo mới TKB</h1>
  <div class="mb-3">
    noi dung bo trong
  </div>
  <div class="mb-3">
    <button class="btn btn-primary" @click="getLabel">
      Lấy danh sách từ server
    </button>
    <button class="btn btn-primary" @click="getData">
      Lấy dữ liệu từ server
    </button>
  </div>
  <checktable
    ref="chRef"
    :title="'Thời khóa biểu'"
    :labels="labels"
    :datas="datas"
  > </checktable>
  <div class="mb-3 text-end">
    <button
      class="btn btn-primary"
      :disabled="!chRef?.hasChanges"
      @click="handleSyncToServer"
      > Đồng bộ [[ chRef?.changedMapCount ]] dòng</button>
  </div>
</div>
<style>
  .check-panel {
    border: 1px solid #ccc;
    padding: 10px;
    /* BẮT BUỘC: Tạo vùng cuộn để sticky hoạt động */
    /*max-height: 80vh;*/
    /*overflow-y: auto;*/
  }
  
  .check-table {
    border-collapse: collapse;
    width: 100%;
  }

  .check-thead {
    background-color: #eee;
  }

  .check-thead .check-th {
    position: sticky;
    top: 0;
    z-index: 10;
    /* ĐÃ SỬA: Bỏ dấu phẩy, dùng khoảng trắng */
    box-shadow: 0 1px 0 #d1d5db; 
    /* ĐẢM BẢO: Không bị xuyên thấu khi cuộn */
    background-color: #eee; 
  }

  .check-title {
    font-size: 1.2rem;
    font-weight: bold;
  }

  .check-tr {
    border-bottom: 1px solid #ccc;
    background-color: #fff;
  }

  .check-th,
  .check-th-cell {
    padding: 10px;
    text-align: center;
  }

  .check-tbody {
    border-bottom: 1px solid #ccc;
  }

  .check-td,
  .check-td-cell {
    padding: 10px;
    text-align: center;
  }

  .check-input {
    outline: none;
  }

  .check-input-dirty {
    outline: 2px solid red;
    background-color: lightcoral;
  }
</style><script src="static/components/checktable.js?v=2"></script>
<script>
  const { createApp, ref, onMounted } = Vue;
  const app = createApp({
    delimiters: ['[[', ']]'],
    setup() {
      const labels = ref({
        rows: ["10A1", "10A2", "10C1", "10C2", "10C3", "10C4", "11A1", "11A2"],
        cols: ["Toán", "Văn", "Lý", "Hóa", "Sinh", "Tin", "Sử", "Địa"],
      });
      const datas = ref({
        "10A1":[true,false,false,false,false,false,false,false],
        "10A2":[false,true,false,false,false,false,false,false],
        "10C1":[false,false,true,false,false,false,false,false],
        "10C2":[false,false,false,true,false,false,false,false],
        "10C3":[false,false,false,false,true,false,false,false],
        "10C4":[false,false,false,false,false,true,false,false],
        "11A1":[false,false,false,false,false,false,true,false],
        "11A2":[false,false,false,false,false,false,false,true],
      });
      const chRef = ref(null);


      const getLabel =() =>{
        fetch('api/giaovien')
          .then(response => response.json())
          .then(data => {
            console.log(data);
            labels.value[0].options = Object.values(data);
          })
          .catch(error => {
            console.error(error);
          });

      };
      const getLop = () => {
        fetch('api/lop')
          .then(response => response.json())
          .then(data => {
            console.log(data);
            labels.value[1].options = Object.values(data);
          })
          .catch(error => {
            console.error(error);
          });
      };

      const getData = () => {
        fetch('api/phancong')
          .then(response => response.json())
          .then(data => {
            console.log(data);
            datas.value = Object.values(data);
          })
          .catch(error => {
            console.error(error);
          });
        console.log(labels.value);
        console.log(datas.value);
      };
      onMounted(() => {
        //getData();
      });

      // 2. Hàm đồng bộ dữ liệu
      const handleSyncToServer = () => {
        if (!chRef.value.hasChanges) return;
        const data = [];
        Object.keys(chRef.value.changedMap).forEach(key => {
          const [rkey, cIndex] = String(key).split('_');
          data.push({
            lop: rkey,
            mon_hoc: labels.value.cols[cIndex],
            phan_cong: chRef.value.changedMap[key],
          });
        });
        console.log(chRef.value.changedMap);
        console.log(data);
        fetch('api/phancong/sync', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data),
        })
          .then(response => response.json())
          .then(res => {
            console.log(res);
          })
          .catch(error => {
            console.log(error);
          });
      };

      // 1. Hàm lấy dữ liệu từ Golang Server
      return {
        labels,
        datas,
        chRef,
        getLabel,
        getData,
        handleSyncToServer,
      };
    }
  });
  app.component('checktable', CheckTable);
  app.mount('#app');
</script>
{{end}}
