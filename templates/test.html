{{define "content"}}
<div id="app">
  <h1>Tạo mới TKB</h1>
  <checktable
    v-model="gridRef"
    :title="'Thời khóa biểu'"
    :labels="labels"
    :datas="datas"
  />
  <div class="mb-3 text-end">
    <button
      class="btn btn-primary"
      :disabled="!gridRef?.hasChanges"
      @click="handleSyncToServer"
    > Đồng bộ [[ gridRef?.changedPayload?.length || 0 ]] thay đổi</button>
  </div>
</div>

<script src="static/components/checktable.js?v=2"></script>
<script>
  const { createApp, ref, onMounted } = Vue;
  const app = createApp({
    setup() {
      const labels = ref({
        rows: {
          1:"10A1",
          2:"10A2",
          3:"10C1",
          4:"10C2",
          5:"10C3",
          6:"10C4",
          7:"11A1",
          8:"11A2",
          },
        cols: {
          1:"Toán",
          2:"Văn",
          3:"Lý",
          4:"Hóa",
          5:"Sinh",
          6:"Tin",
          7:"Sử",
          8:"Địa",
        }
      });
      const datas = ref({
        1:[true,false,false,false,false,false,false,false],
        2:[false,true,false,false,false,false,false,false],
        3:[false,false,true,false,false,false,false,false],
        4:[false,false,false,true,false,false,false,false],
        5:[false,false,false,false,true,false,false,false],
        6:[false,false,false,false,false,true,false,false],
        7:[false,false,false,false,false,false,true,false],
        8:[false,false,false,false,false,false,false,true],
      });
      const chref = ref(null);


      const getLabel =() =>{
        fetch('api/giaovien')
          .then(response => response.json())
          .then(data => {
            console.log(data);
            labels.value[0].options = Object.values(data);
          })
          .catch(error => {
            console.error(error);
          });

      }
      const getLop = () => {
        fetch('api/lop')
          .then(response => response.json())
          .then(data => {
            console.log(data);
            labels.value[1].options = Object.values(data);
          })
          .catch(error => {
            console.error(error);
          });
      }

      const getData = () => {
        fetch('api/phancong')
          .then(response => response.json())
          .then(data => {
            console.log(data);
            datas.value = Object.values(data);
          })
          .catch(error => {
            console.error(error);
          });
        console.log(labels.value);
        console.log(datas.value);
      };
      onMounted(() => {
        //getData();
      });

      // 1. Hàm lấy dữ liệu từ Golang Server
      return {
        labels,
        datas,
        chref,
        getLabel,
        getData
      };
    }
  });
  app.component('checktable', CheckTable);
  app.mount('#app');
</script>
{{end}}
